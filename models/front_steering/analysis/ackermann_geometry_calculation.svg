<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">IriSight Ackermann steering geometry calculation</title>
  <desc id="desc">Top-view construction using CAD dimensions. Steering-arm lines converge 165.13 millimetres behind the front kingpin axis, 3.90 millimetres ahead of the 169.03 millimetre wheelbase rear axle.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#12355b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d36b23"/>
    </marker>
    <style>
      .title { font: 700 38px Arial, Helvetica, sans-serif; fill: #12355b; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #49647f; }
      .heading { font: 700 24px Arial, Helvetica, sans-serif; fill: #12355b; }
      .label { font: 600 18px Arial, Helvetica, sans-serif; fill: #12355b; }
      .body { font: 400 18px Arial, Helvetica, sans-serif; fill: #243b53; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #49647f; }
      .value { font: 700 20px Arial, Helvetica, sans-serif; fill: #d36b23; }
      .navy { stroke: #12355b; fill: none; stroke-width: 4; }
      .thin { stroke: #49647f; fill: none; stroke-width: 2; }
      .construction { stroke: #d36b23; fill: none; stroke-width: 3; stroke-dasharray: 12 8; }
      .ideal { stroke: #14919b; fill: none; stroke-width: 3; stroke-dasharray: 4 7; }
      .dimension { stroke: #12355b; fill: none; stroke-width: 2; marker-start: url(#arrow-navy); marker-end: url(#arrow-navy); }
      .orange-dimension { stroke: #d36b23; fill: none; stroke-width: 2; marker-start: url(#arrow-orange); marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#ffffff"/>
  <text x="70" y="66" class="title">Ackermann Steering Geometry — CAD Calculation</text>
  <text x="70" y="101" class="subtitle">IriSight International front steering assembly · all dimensions in millimetres</text>

  <rect x="55" y="135" width="925" height="835" rx="18" fill="#f7f9fc" stroke="#d9e2ec" stroke-width="2"/>
  <text x="90" y="180" class="heading">Top-view construction</text>

  <!-- Vehicle centerline and axle references -->
  <line x1="520" y1="215" x2="520" y2="885" class="thin" stroke-dasharray="8 8"/>
  <line x1="260" y1="270" x2="780" y2="270" class="navy"/>
  <line x1="260" y1="790" x2="780" y2="790" class="navy"/>
  <text x="790" y="276" class="label">Front kingpin axis</text>
  <text x="790" y="796" class="label">Rear axle axis</text>

  <!-- Simplified chassis -->
  <path d="M 330 292 L 330 758 Q 330 775 347 775 L 693 775 Q 710 775 710 758 L 710 292" fill="#eaf0f6" stroke="#9fb3c8" stroke-width="3"/>

  <!-- Wheels -->
  <rect x="307" y="205" width="66" height="130" rx="12" fill="#d9e2ec" stroke="#12355b" stroke-width="4"/>
  <rect x="667" y="205" width="66" height="130" rx="12" fill="#d9e2ec" stroke="#12355b" stroke-width="4"/>
  <rect x="307" y="725" width="66" height="130" rx="12" fill="#d9e2ec" stroke="#12355b" stroke-width="4"/>
  <rect x="667" y="725" width="66" height="130" rx="12" fill="#d9e2ec" stroke="#12355b" stroke-width="4"/>

  <!-- Kingpins and steering arms -->
  <circle cx="340" cy="270" r="10" fill="#ffffff" stroke="#12355b" stroke-width="5"/>
  <circle cx="700" cy="270" r="10" fill="#ffffff" stroke="#12355b" stroke-width="5"/>
  <line x1="340" y1="270" x2="357.44" y2="319.22" class="navy"/>
  <line x1="700" y1="270" x2="682.56" y2="319.22" class="navy"/>
  <circle cx="357.44" cy="319.22" r="8" fill="#d36b23"/>
  <circle cx="682.56" cy="319.22" r="8" fill="#d36b23"/>
  <line x1="357.44" y1="319.22" x2="682.56" y2="319.22" stroke="#d36b23" stroke-width="7"/>
  <text x="520" y="349" class="label" text-anchor="middle">Servo-driven steering link · pin spacing 96.00</text>

  <!-- Extended arm lines -->
  <line x1="340" y1="270" x2="520" y2="778" class="construction"/>
  <line x1="700" y1="270" x2="520" y2="778" class="construction"/>
  <line x1="340" y1="270" x2="520" y2="790" class="ideal"/>
  <line x1="700" y1="270" x2="520" y2="790" class="ideal"/>
  <circle cx="520" cy="778" r="10" fill="#d36b23"/>
  <circle cx="520" cy="790" r="6" fill="#14919b"/>
  <text x="540" y="766" class="value">CAD convergence: 165.13</text>
  <text x="540" y="824" class="body">Ideal point: rear axle at 169.03</text>

  <!-- Track dimension -->
  <line x1="340" y1="207" x2="340" y2="165" class="thin"/>
  <line x1="700" y1="207" x2="700" y2="165" class="thin"/>
  <line x1="340" y1="176" x2="700" y2="176" class="dimension"/>
  <text x="520" y="160" class="label" text-anchor="middle">Kingpin spacing T = 106.30</text>

  <!-- Wheelbase dimension -->
  <line x1="280" y1="270" x2="220" y2="270" class="thin"/>
  <line x1="280" y1="790" x2="220" y2="790" class="thin"/>
  <line x1="232" y1="270" x2="232" y2="790" class="dimension"/>
  <text x="204" y="530" class="label" text-anchor="middle" transform="rotate(-90 204 530)">Wheelbase L = 169.03</text>

  <!-- Local arm dimensions, deliberately enlarged callout -->
  <path d="M 700 270 A 52 52 0 0 1 682.56 319.22" class="orange-dimension"/>
  <text x="742" y="335" class="value">17.84°</text>
  <line x1="700" y1="377" x2="682.56" y2="377" class="orange-dimension"/>
  <text x="691" y="402" class="body" text-anchor="middle">inset 5.15</text>
  <line x1="758" y1="270" x2="758" y2="319.22" class="orange-dimension"/>
  <text x="780" y="296" class="body">rearward 16.00</text>

  <!-- Legend -->
  <line x1="100" y1="916" x2="160" y2="916" class="construction"/>
  <text x="174" y="922" class="small">Actual CAD arm projection</text>
  <line x1="410" y1="916" x2="470" y2="916" class="ideal"/>
  <text x="484" y="922" class="small">Ideal projection to rear axle</text>

  <!-- Calculation panel -->
  <rect x="1020" y="135" width="525" height="835" rx="18" fill="#ffffff" stroke="#9fb3c8" stroke-width="3"/>
  <text x="1060" y="180" class="heading">Dimensions from current CAD</text>
  <text x="1060" y="222" class="body">Front kingpin spacing</text>
  <text x="1498" y="222" class="value" text-anchor="end">T = 106.30</text>
  <text x="1060" y="258" class="body">Rear axle position</text>
  <text x="1498" y="258" class="value" text-anchor="end">xᵣ = 35.54</text>
  <text x="1060" y="294" class="body">Front axle position</text>
  <text x="1498" y="294" class="value" text-anchor="end">x𝒇 = 204.57</text>
  <text x="1060" y="330" class="body">Steering-arm pin spacing</text>
  <text x="1498" y="330" class="value" text-anchor="end">96.00</text>
  <text x="1060" y="366" class="body">Arm-pin rearward offset</text>
  <text x="1498" y="366" class="value" text-anchor="end">s = 16.00</text>

  <line x1="1060" y1="395" x2="1505" y2="395" stroke="#d9e2ec" stroke-width="2"/>
  <text x="1060" y="438" class="heading">Calculation</text>
  <text x="1060" y="480" class="body">L = x𝒇 − xᵣ = 204.57 − 35.54</text>
  <text x="1498" y="514" class="value" text-anchor="end">L = 169.03</text>

  <text x="1060" y="558" class="body">Δx = 106.30/2 − 96.00/2</text>
  <text x="1498" y="592" class="value" text-anchor="end">Δx = 5.15</text>

  <text x="1060" y="636" class="body">θ = atan(Δx / s)</text>
  <text x="1498" y="670" class="value" text-anchor="end">θ = 17.84°</text>

  <text x="1060" y="714" class="body">Lₚ = s × (T/2) / Δx</text>
  <text x="1498" y="748" class="value" text-anchor="end">Lₚ = 165.13</text>

  <line x1="1060" y1="776" x2="1505" y2="776" stroke="#d9e2ec" stroke-width="2"/>
  <text x="1060" y="818" class="heading">Comparison with ideal Ackermann</text>
  <text x="1060" y="856" class="body">Ideal inset = s × (T/2) / L</text>
  <text x="1498" y="856" class="value" text-anchor="end">5.03</text>
  <text x="1060" y="892" class="body">Actual inset difference</text>
  <text x="1498" y="892" class="value" text-anchor="end">+0.12</text>
  <text x="1060" y="928" class="body">Convergence error = L − Lₚ</text>
  <text x="1498" y="928" class="value" text-anchor="end">3.90 (2.31%)</text>

  <text x="70" y="1018" class="small">Conclusion: the steering-arm projections converge within 3.90 mm of the rear axle center, providing a close Ackermann construction. CAD-derived geometry; physical inner/outer wheel-angle measurements remain separate test evidence.</text>
</svg>
